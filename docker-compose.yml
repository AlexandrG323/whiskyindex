services:
  db:
    image: postgres:16-alpine
    container_name: whiskyindex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whisky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whisky}
      POSTGRES_DB: ${POSTGRES_DB:-whiskyindex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + demo seed on first boot only (empty volume).
      # Re-seed local: npm run db:seed  (prod: npm run db:seed:prod)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whisky} -d ${POSTGRES_DB:-whiskyindex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: whiskyindex_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Always reach Postgres via the compose service name (overrides localhost in backend/.env).
      DATABASE_URL: postgresql://${POSTGRES_USER:-whisky}:${POSTGRES_PASSWORD:-whisky}@db:5432/${POSTGRES_DB:-whiskyindex}
      # Bind mounts on Docker Desktop (macOS) need polling for reliable Nest --watch.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/nest-cli.json:/app/nest-cli.json
      - ./backend/tsconfig.json:/app/tsconfig.json

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: whiskyindex_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Inside compose the API is a service name, not localhost.
      VITE_API_PROXY: http://api:3000
    ports:
      - "5173:5173"
    # Only sources, never node_modules — mounting the whole directory would
    # shadow the image's installed dependencies with the host's.
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json

volumes:
  pgdata:

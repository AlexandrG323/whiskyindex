# fly.toml app configuration file generated for whiskyindex on 2026-08-17T16:57:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'whiskyindex'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'runner'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  MOEX_ISS_BASE_URL = 'https://iss.moex.com'
  YAHOO_CHART_BASE_URL = 'https://query1.finance.yahoo.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'

[[restart]]
  policy = 'on-failure'
  processes = ['app']
  retries = 3

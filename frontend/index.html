<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisky Index — Бутылка или Портфель?</title>
    <meta
      name="description"
      content="Сравните стоимость корзины скуфа с ростом акций за выбранный период."
    />

    <!-- .ico carries 16/32/48 in one file: the format Safari reaches for first,
         and the one every legacy path understands. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- iOS home screen. 180x180, fully opaque — iOS applies its own rounded
         mask and composites transparency onto white. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- macOS Safari pinned tabs: a single-colour silhouette, not the render. -->
    <link rel="mask-icon" href="/mask-icon.svg" color="#e9922e" />

    <!-- Safari 15+ tints the tab bar and iOS status bar with this. -->
    <meta name="theme-color" content="#0b0b0d" />
    <!-- Label used when the page is added to the iOS home screen. -->
    <meta name="apple-mobile-web-app-title" content="Whisky Index" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    # Already-compressed formats: png/webp/woff2 gain nothing and cost CPU.

    # ^~ takes precedence over the regex location below, so an API path that
    # happens to end in .json can never be captured and served as a file.
    location ^~ /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Swagger UI loads its own assets under /api/docs/
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # Vite writes content-hashed filenames here, so the URL changes whenever
    # the bytes do and these can be cached indefinitely.
    # ^~ is required, not stylistic: a plain prefix location loses to the regex
    # below, which would quietly demote every hashed bundle to the 7d bucket.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every other real asset. The `=404` is the point: without it the SPA
    # fallback below answers a missing file with index.html and HTTP 200, so a
    # typo'd image path looks like success to curl, to fetch(), and to any
    # health check — only a human looking at a broken <img> would catch it.
    # These filenames are not content-hashed, so they revalidate via ETag
    # rather than being cached immutably.
    # Set Cache-Control via add_header only — pairing it with `expires` emits
    # two competing Cache-Control headers rather than overriding.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|css|js|mjs|map|woff2?|ttf|eot|json|txt|xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    # index.html must never be cached: it carries the hashed asset URLs, so a
    # cached copy pins returning visitors to the previous deploy's bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes only. Anything with a file extension was handled above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
